<title id="t">How it flows</title>
<desc id="d">1. Your question → Locate the stage；2. Locate the stage → Search to need；3. Search to need → Access allowed?；4. Access allowed? → Extract；5. Extract → Citation check；6. Citation check → Deliver results；7. Deliver results → Next step</desc>
