<rect data-node="U" x="664" y="526" width="180" height="64" rx="32" fill="#eef1f4" stroke="#57606a" stroke-width="1.5"/>
<text data-name="U" x="754" y="554" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">交給你自己開</text>
<text data-role="U" x="754" y="577" text-anchor="middle" font-size="13" fill="#57606a">記為缺口</text>
<rect data-node="OUT" x="1288" y="768" width="180" height="64" rx="32" fill="#eef1f4" stroke="#57606a" stroke-width="1.5"/>
<text data-name="OUT" x="1378" y="796" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">書單直接給你</text>
<text data-role="OUT" x="1378" y="819" text-anchor="middle" font-size="13" fill="#57606a">不做階段診斷</text>
