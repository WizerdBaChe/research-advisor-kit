<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1574 902" width="1574" height="902" role="img" aria-labelledby="t d" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="t">運作流程</title>
<desc id="d">1. 你的研究問題 → 先判斷階段；2. 先判斷階段 → 依需求搜尋；3. 依需求搜尋 → 准不准讀取；4. 准不准讀取 → 抽取內容；5. 抽取內容 → 引用查核；6. 引用查核 → 交付結果；7. 交付結果 → 下一步與理由</desc>
<defs><marker id="m-main" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 4L0 8z" fill="#0969da"/></marker><marker id="m-side" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 4L0 8z" fill="#6e7781"/></marker><marker id="m-back" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 4L0 8z" fill="#cf222e"/></marker></defs>
